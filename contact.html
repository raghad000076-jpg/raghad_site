<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إحصائيات بالأعمدة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-image:url(imge/Download\ premium\ vector\ of\ White\ and\ gold….jpg);
     background-repeat: no-repeat;
       background-size:cover;
    }

    .chart-container {
      width: 80%;
      max-width: 600px;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 300px;
      border-left: 2px solid #010101;
      border-bottom: 2px solid #333;
      padding: 10px;
    }

    .bar {
      width: 50px;
      background-color: #dabf23;
      text-align: center;
      color: #aa5913;
      border-radius: 5px 5px 0 0;
      transition: 0.3s ease;
    }

    .bar:hover {
      background-color: #da7e05;
      transform: scale(1.1);
    }

    .bar span {
      display: block;
      margin-top: -20px;
      font-size: 14px;
    }

    .label {
      text-align: center;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-size: 17px;
      display: inline-block;
    padding: 10px;
    }
    .h1
 {color: #875f08;
    text-shadow: 2px 7px 9px rgba(230, 100, 8, 0.552);}
    .div{width: 600px;}
  </style>
</head>
<body>
    <div align="center" class="div"> 
    <h3 class="h1">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h3>
    <H3 class="h1" >ِ﴾ فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرفَعَ وَيُذكَرَ فِيهَا اسمُهُ يُسَبِّحُ لَهُ فِيهَا بِالغُدُوِّ وَالآصالِ﴿</H3><br><br>
  <div class="chart-container">
    <div class="chart">
        <div class="bar" style="height: 70%;" title="70%">
        <span>70%</span><div class="label">داريا</div>
      </div>
      <div class="bar" style="height: 50%;" title="50%">
        <span>50%</span><div class="label">عربين</div>
      </div>
      <div class="bar" style="height: 70%;" title="70%">
        <span>70%</span><div class="label">حرستا</div>
      </div>
      <div class="bar" style="height: 90%;" title="90%">
        <span>90%</span><div class="label">جوبر</div>
      </div>
      <div class="bar" style="height: 30%;" title="30%">
        <span>30%</span> <div class="label">دوما</div>
        
      </div>
    </div>
   
  </div>
  </div>
</body>
</html>
