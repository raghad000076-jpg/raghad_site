<script>
   function validateArabicInput(input) {
       let arabicPattern = /[\u0600-\u06FF\s]+/; // تعبيرات قوائم الحروف العربية
       if (!arabicPattern.test(input.value)) {
           document.getElementById("error").innerText = "الرجاء إدخال حروف باللغة العربية فقط";
           input.value = ""; // مسح المحتوى إذا كانت الإدخالات غير صحيحة
       } else {
           document.getElementById("error").innerText = "";
       }
   }




 </script>
